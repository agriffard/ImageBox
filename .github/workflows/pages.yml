name: Deploy Sample to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish sample app
        run: dotnet publish samples/ImageBox.Sample/ImageBox.Sample.csproj -c Release -o dist

      - name: Configure base path
        run: sed -i 's#<base href="/" />#<base href="/ImageBox/" />#' dist/wwwroot/index.html

      - name: Add .nojekyll
        run: touch dist/wwwroot/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4
